name: Build Mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the mod project
        run: |
          ls -la
          mkdir mod
          for z in *Mod*.zip; do unzip -o "$z" -d mod; done
          ls -la mod

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PirateShopAccess-mod
          path: mod/build/libs/*.jar
